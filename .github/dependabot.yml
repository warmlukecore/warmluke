# Weekly proposals to update what this repository depends on, as pull
# requests that CI checks like any other (the static job; the live one
# needs secrets Dependabot is not given, and runs once merged).
#
# npm covers pnpm's lockfile. Minor and patch updates come as one pull
# request a week; a major one comes on its own, because it is the kind
# that changes behaviour. github-actions keeps the commit-pinned actions
# in .github/workflows current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
