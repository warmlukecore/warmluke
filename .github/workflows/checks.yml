# What runs on every push, with no secrets.
#
# The static job needs nothing that is not already public: the two
# NEXT_PUBLIC values are shipped to every browser that opens the app,
# so they live in repository variables, not secrets. It runs the type
# check, the build, and every check that scripts/run-checks.mjs
# classifies as pure — which it does by reading the files, so a new
# check joins this on its next push without anyone listing it.
#
# The live tier (database + running server) and the model tier (paid,
# non-deterministic) are deliberately not here. Live joins once it has
# somewhere safe to point at that is not the production database.
#
# This does not stop a deploy: Vercel deploys main on push regardless,
# in parallel with this rather than after it. So these jobs tell you,
# on the commit, whether it should have — which is not the same thing
# as stopping it, and is worth saying out loud rather than implying.
#
# Making the deploy wait means taking it off Vercel's git integration
# and giving it to a job here that needs both of the jobs below. That
# needs a deploy token in this repository's secrets, which is the
# merchant's call, so it is written down rather than done quietly.

name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  # Cancelled on a branch, never on main.
  #
  # A pull request pushed twice in a minute has nothing to learn from
  # the first run. main does: Vercel deploys every commit on its own,
  # so a run cancelled by the next push leaves a commit that is LIVE
  # and was never checked. That happened to 266402e — cancelled by the
  # push after it, deployed anyway, and the only evidence it was fine
  # is that the next commit's run passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read the code, nothing more. Nothing here writes to the repository:
# the deploy talks to Vercel with its own token, not this one.
permissions:
  contents: read

jobs:
  static:
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19 on its own.
    # The OS under the build changes when somebody here changes it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Every action is pinned to a commit, with its version beside it:
      # a tag can be moved by whoever holds that repository, a hash
      # cannot. Dependabot (.github/dependabot.yml) proposes the next.
      # No credentials are left on disk: nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm, because that is what node_modules/.pnpm says this repo
      # installs with; the version is pinned so the runner and a laptop
      # resolve the same lockfile the same way.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Four runtime dependencies, one of them Next.js, which has had
      # real CVEs. The script already existed; it just never ran.
      - name: audit
        run: pnpm audit --audit-level=high

      - name: type check
        run: pnpm exec tsc --noEmit

      # Correctness rules fail the build; the rest are advice (.oxlintrc.json).
      - name: lint
        run: pnpm lint

      # Public values only. The build prerenders /admin, which makes a
      # Supabase client at module load and refuses to without these;
      # two of the pure checks read the same file.
      # Through env, never written into the script: a value expanded into
      # the shell is run as shell.
      - name: .env.local from public values
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_ANON_KEY }}
        run: |
          printf 'NEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_URL=%s\nNEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.local

      - name: build
        run: pnpm build

      - name: pure checks
        run: node scripts/run-checks.mjs --tier pure

      # This file's own security: unpinned actions, token scope, values
      # expanded into shell. Pinned like everything else here.
      - name: workflow security (zizmor)
        run: pipx run zizmor==1.30.1 --format plain .github/workflows

  # The live tier: a database and a running server, on the check
  # project — a blank copy of production with keys of its own that have
  # never been anywhere but here. Production's keys are not in this
  # repository's secrets and are not needed: what the checks prove is
  # the code, and the code is the same.
  #
  # Two things are skipped here by name, not by crashing: the six
  # checks that need the management PAT (account-wide, so it stays on
  # a laptop), and the harness driven by hand with ABO_JWT.
  live:
    needs: static
    # Secrets are not handed to pull requests from forks; on a public
    # repository this job would only fail there, and say nothing. Nor to
    # Dependabot's, which the static job checks; merging one runs this
    # on main like any other push.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The check project's, and only these three. The build inlines
      # the two public ones, so the built app points at the check
      # project; the scripts read the third.
      - name: .env.local for the check project
        env:
          SUPABASE_URL: ${{ secrets.CHECK_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.CHECK_SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.CHECK_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.CHECK_DATABASE_URL }}
        run: |
          printf 'NEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_URL=%s\nNEXT_PUBLIC_ADAPTIVE_OS_SUPABASE_ANON_KEY=%s\nADAPTIVE_OS_SERVICE_ROLE_KEY=%s\nDATABASE_URL=%s\nCHECK_PROJECT=1\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SERVICE_ROLE_KEY" "$DATABASE_URL" > .env.local

      # The check project is brought up to the repo before anything
      # reads it: a migration committed with the change it serves is
      # applied here, in order, once, with the ledger — so a new one
      # needs no hand on it. Then the seed the checks assume: the
      # check user as an administrator, and a shop to read.
      - name: psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: migrations, onto the check project
        run: node scripts/apply-migrations.mjs --env .env.local

      - name: seed
        run: node --experimental-strip-types --import ./scripts/ts-hook.mjs scripts/seed-check-project.mjs --env .env.local

      - name: build
        run: pnpm build

      # Model calls are played back from tapes/ (src/lib/model-tape.ts): no
      # model key is held here, and a check recorded against real models
      # replays exactly. A call nothing was recorded for fails at once.
      - name: serve
        env:
          MODEL_TAPE: replay
        run: |
          (pnpm start > server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3100/login || { echo "server did not come up"; tail -30 server.log; exit 1; }

      - name: live checks
        run: node scripts/run-checks.mjs --tier live

      # The app in a browser, at desktop and phone width, against the
      # server above; Luke's turns play back from tapes/ like the checks'.
      - name: browser for the end-to-end specs
        run: pnpm exec playwright install --with-deps chromium

      - name: end to end
        run: pnpm exec playwright test

      - name: end-to-end report, when something went red
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: server log, when something went red
        if: failure()
        run: tail -60 server.log

  # Production, after the checks that could have stopped it.
  #
  # Vercel's own git integration deploys main on push, in parallel
  # with the jobs above rather than after them — so a commit could go
  # live and only afterwards be told it was broken, and one did.
  # It also missed commits outright twice in one day, passing checks
  # and never deploying.
  #
  # This job is the answer to both: the deploy happens once, here,
  # when the checks have passed, and a red deploy is a red commit.
  # It builds from the git commit rather than uploading a copy, so
  # what runs in production is what is in this repository.
  #
  # Two identifiers below rather than repository variables: a team id
  # and a project id are names, not secrets, and inlining them means
  # one thing to configure instead of three.
  deploy:
    needs: [static, live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: deploy this commit to production
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: team_VkD2EYIcYFQlGRuynsnjn4pW
          PROJECT: prj_eQ2739Vaeux1vp8KUsv0vqSlAY39
        run: |
          set -euo pipefail
          # Absent until somebody adds it. Saying so and passing is
          # right: without it Vercel's git integration is still
          # deploying, so a red job here would be a lie about the app.
          if [ -z "${TOKEN}" ]; then
            echo "No VERCEL_TOKEN in this repository's secrets."
            echo "Vercel's git integration is still deploying main on its own."
            exit 0
          fi

          id=$(curl -fsS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=$TEAM&forceNew=1&skipAutoDetectionConfirmation=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"warmluke\",\"project\":\"$PROJECT\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"warmlukecore\",\"repo\":\"warmluke\",\"ref\":\"main\",\"sha\":\"$GITHUB_SHA\"}}" \
            | jq -r .id)
          echo "deployment $id, from ${GITHUB_SHA:0:7}"

          # Waited for, not fired and forgotten. A build that fails on
          # Vercel has to turn this job red, or the commit reads as
          # deployed when nothing was.
          for _ in $(seq 1 90); do
            state=$(curl -fsS "https://api.vercel.com/v13/deployments/$id?teamId=$TEAM" \
              -H "Authorization: Bearer $TOKEN" | jq -r .readyState)
            case "$state" in
              READY) echo "ready"; exit 0 ;;
              ERROR|CANCELED) echo "deployment $state"; exit 1 ;;
              *) echo "  $state"; sleep 10 ;;
            esac
          done
          echo "still not ready after fifteen minutes"
          exit 1
